# Configuração do Nginx para a aplicação de notificações de e-mail
# Instalação:
# 1. sudo cp notifica.conf /etc/nginx/sites-available/notifica
# 2. sudo ln -s /etc/nginx/sites-available/notifica /etc/nginx/sites-enabled/notifica
# 3. sudo nginx -t  (validar sintaxe)
# 4. sudo systemctl restart nginx

upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # Limite de tamanho de corpo
    client_max_body_size 10M;

    # Gzip compression para responses
    gzip on;
    gzip_types text/plain application/json text/css text/javascript;
    gzip_min_length 1000;

    # ============================================
    # Static files — /static/* servido via alias
    # (index.html usa src="/static/script.js")
    # ============================================
    location /static/ {
        alias /home/notificacao-email-comAI/notification_app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # Raiz — proxy para FastAPI (serve index.html)
    # ============================================
    location = / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ============================================
    # API endpoints — proxy para FastAPI
    # ============================================
    location /api/ {
        # Não fazer cache de respostas da API
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        # Headers obrigatórios para proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts padrão (para endpoints normais)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # CRÍTICO: Endpoint /api/stream (SSE)
    # ============================================
    location /api/stream {
        # NÃO fazer buffer de SSE — enviar dados em tempo real
        proxy_buffering off;
        proxy_cache off;

        # Timeout muito longo para permitir conexões SSE permanentes
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_connect_timeout 60s;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        # IMPORTANTE: Connection "" mantém keep-alive sem upgrade (SSE ≠ WebSocket)
        proxy_set_header Connection "";

        # Headers essenciais
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evitar compressão de SSE (quebraria o stream)
        proxy_set_header Accept-Encoding "";

        # Headers SSE corretos para o cliente
        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
    }

    # ============================================
    # Endpoint /api/tts
    # ============================================
    location /api/tts {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        # Streaming de áudio — não fazer buffer
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts adequados para geração de áudio
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ============================================
    # Health check — sem proxy
    # ============================================
    location /health {
        access_log off;
        proxy_pass http://fastapi_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ============================================
    # Logging
    # ============================================
    access_log /var/log/nginx/notifica_access.log;
    error_log /var/log/nginx/notifica_error.log warn;
}
